workflows:
  deqton-ios:
    name: DEQTON iOS
    max_build_duration: 60

    environment:
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor iOS
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

    artifacts:
      - ios/App/build/**/*
